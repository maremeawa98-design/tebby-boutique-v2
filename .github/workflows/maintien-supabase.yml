# Un projet Supabase gratuit se met en pause après 7 jours sans activité.
# Le site étant statique, cette requête quotidienne le garde éveillé.
# À renseigner dans Settings > Secrets and variables > Actions : SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY.
name: Maintien Supabase

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "Secrets manquants"; exit 1; }
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $KEY" "$URL/rest/v1/delivery_rates?select=id&limit=1" > /dev/null
          echo "Supabase répond."
